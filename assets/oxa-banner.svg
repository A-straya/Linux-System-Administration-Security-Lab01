<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="OXA LNX Linux Infrastructure and Security, Lab 01" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0b3d1c" stroke-width="1"/></pattern>
  <radialGradient id="v" cx="50%" cy="50%" r="75%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".6"/></radialGradient>
</defs>
<rect width="1200" height="320" fill="#021208"/>
<rect width="1200" height="320" fill="url(#grid)"/>
<g font-family="'Courier New',Courier,monospace" font-size="16" fill="#3dff7a" opacity=".16">
  <text x="700" y="0" writing-mode="tb"><animateTransform attributeName="transform" type="translate" values="0,-150;0,340" dur="7s" repeatCount="indefinite"/>0 1 X A 0 1 # 0 1</text>
  <text x="780" y="0" writing-mode="tb"><animateTransform attributeName="transform" type="translate" values="0,-200;0,340" dur="9s" repeatCount="indefinite"/>1 0 / 1 A 0 X 1</text>
  <text x="850" y="0" writing-mode="tb"><animateTransform attributeName="transform" type="translate" values="0,-120;0,340" dur="6s" repeatCount="indefinite"/>X 1 0 # 1 0 A</text>
  <text x="1010" y="0" writing-mode="tb"><animateTransform attributeName="transform" type="translate" values="0,-180;0,340" dur="8s" repeatCount="indefinite"/>0 A 1 1 0 X /</text>
  <text x="1090" y="0" writing-mode="tb"><animateTransform attributeName="transform" type="translate" values="0,-160;0,340" dur="10s" repeatCount="indefinite"/>1 # 0 X 1 A 0 1</text>
  <text x="1160" y="0" writing-mode="tb"><animateTransform attributeName="transform" type="translate" values="0,-140;0,340" dur="7.5s" repeatCount="indefinite"/>A 0 1 0 X 1 #</text>
</g>
<g font-family="'Courier New',Courier,monospace">
  <text x="60" y="145" font-size="118" font-weight="700" fill="#c4ffd6" filter="url(#g)">OXA<tspan fill="#3dff7a">//</tspan>LNX</text>
  <text x="64" y="192" font-size="21" fill="#1b9a48">Linux Infrastructure &amp; Security  -  Lab 01</text>
  <clipPath id="t"><rect x="60" y="230" height="34" width="0"><animate attributeName="width" values="0;830;830;0" keyTimes="0;.5;.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  <text x="64" y="255" font-size="22" fill="#3dff7a" clip-path="url(#t)" filter="url(#g)">root@oxa-linux01:~# ./build --secure --automate --document</text>
  <rect x="64" y="236" width="12" height="22" fill="#3dff7a" filter="url(#g)"><animate attributeName="x" values="64;894;894;64" keyTimes="0;.5;.92;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
<g font-family="'Courier New',Courier,monospace" font-size="15">
  <rect x="940" y="50" width="220" height="150" fill="#041f0e" stroke="#12803a"/>
  <text x="954" y="74" fill="#1b9a48">oxa-linux01</text>
  <text x="954" y="100" fill="#3dff7a">[ OK ]  sshd</text>
  <text x="954" y="122" fill="#3dff7a">[ OK ]  firewalld</text>
  <text x="954" y="144" fill="#3dff7a">[ OK ]  SELinux</text>
  <text x="954" y="166" fill="#3dff7a">[ OK ]  auditd</text>
  <text x="954" y="188" fill="#ffc247">[ RUN ] backup.timer<animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></text>
</g>
<rect width="1200" height="3" fill="#3dff7a" opacity=".1"><animateTransform attributeName="transform" type="translate" values="0,-4;0,324" dur="4s" repeatCount="indefinite"/></rect>
<rect x="1.5" y="1.5" width="1197" height="317" fill="none" stroke="#12803a" stroke-width="2"><animate attributeName="stroke" values="#12803a;#3dff7a;#12803a" dur="4s" repeatCount="indefinite"/></rect>
<rect width="1200" height="320" fill="url(#v)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
