<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Animated map: Windows 10 host, VMware, firewalld, sshd and oxa-linux01 with identity, SELinux, auditd and backup components" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0b3d1c" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="430" fill="#021208"/>
<rect width="1200" height="430" fill="url(#grid)"/>
<g stroke="#1b9a48" stroke-width="1.5" opacity=".7" fill="none">
  <path d="M90 210H800"/>
  <path d="M800 210L610 70"/><path d="M800 210L870 70"/><path d="M800 210L1040 120"/>
  <path d="M800 210L700 360"/><path d="M800 210L920 360"/><path d="M800 210L1090 290"/>
</g>
<g fill="#021208" stroke="#3dff7a" stroke-width="2" filter="url(#g)">
  <rect x="81" y="201" width="18" height="18"/><rect x="241" y="201" width="18" height="18"/><rect x="401" y="201" width="18" height="18"/><rect x="561" y="201" width="18" height="18"/>
  <rect x="610" y="190" width="40" height="40" transform="translate(170 0)"/>
  <rect x="601" y="61" width="18" height="18"/><rect x="861" y="61" width="18" height="18"/><rect x="1031" y="111" width="18" height="18"/>
  <rect x="691" y="351" width="18" height="18"/><rect x="911" y="351" width="18" height="18"/><rect x="1081" y="281" width="18" height="18"/>
</g>
<rect x="790" y="200" width="20" height="20" fill="#3dff7a" filter="url(#g)"><animate attributeName="opacity" values="1;.5;1" dur="2.4s" repeatCount="indefinite"/></rect>
<g font-family="'Courier New',Courier,monospace" font-size="15" fill="#c4ffd6" text-anchor="middle">
  <text x="90" y="246">Windows 10</text><text x="90" y="264" fill="#1b9a48">PowerShell</text>
  <text x="250" y="246">VMware</text><text x="250" y="264" fill="#1b9a48">Host-only</text>
  <text x="410" y="246">firewalld</text><text x="410" y="264" fill="#1b9a48">zone: ssh</text>
  <text x="570" y="246">sshd :22</text><text x="570" y="264" fill="#1b9a48">key auth</text>
  <text x="800" y="256" font-size="17">oxa-linux01</text><text x="800" y="274" fill="#1b9a48">Fedora</text>
  <text x="610" y="48">labadmin</text><text x="870" y="48">analyst</text><text x="1040" y="98">/srv/oxa</text>
  <text x="700" y="394">SELinux</text><text x="700" y="412" fill="#1b9a48">enforcing</text>
  <text x="920" y="394">auditd</text><text x="920" y="412" fill="#1b9a48">oxa.rules</text>
  <text x="1090" y="322">oxa-backup.timer</text><text x="1090" y="340" fill="#1b9a48">daily 02:00</text>
</g>
<g filter="url(#g)">
  <circle r="5" fill="#3dff7a"><animateMotion dur="6s" repeatCount="indefinite" path="M90 210H800" keyPoints="0;1;1" keyTimes="0;.7;1" calcMode="linear"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.7;.76;1" dur="6s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#ff5a4d"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M90 210H570" keyPoints="0;1;1" keyTimes="0;.7;1" calcMode="linear"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.7;.76;1" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#c4ffd6"><animateMotion dur="7s" begin="1s" repeatCount="indefinite" path="M1090 290L800 210L1040 120"/></circle>
  <circle r="3" fill="#3dff7a"><animateMotion dur="3.2s" repeatCount="indefinite" path="M800 210L610 70"/></circle>
  <circle r="3" fill="#3dff7a"><animateMotion dur="3.8s" begin="1s" repeatCount="indefinite" path="M870 70L800 210"/></circle>
  <circle r="3" fill="#3dff7a"><animateMotion dur="3.4s" begin="2s" repeatCount="indefinite" path="M800 210L700 360"/></circle>
  <circle r="3" fill="#3dff7a"><animateMotion dur="4s" begin=".5s" repeatCount="indefinite" path="M800 210L920 360"/></circle>
</g>
<g font-family="'Courier New',Courier,monospace" font-size="15">
  <text x="570" y="180" fill="#ff5a4d" text-anchor="middle" opacity="0">DENIED<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.72;.76;.95;1" dur="6s" begin="3s" repeatCount="indefinite"/></text>
  <text x="800" y="178" fill="#3dff7a" text-anchor="middle" opacity="0">KEY ACCEPTED<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.7;.76;.95;1" dur="6s" repeatCount="indefinite"/></text>
  <text x="30" y="410" fill="#1b9a48">green: labadmin with key    red: root / analyst refused at sshd</text>
</g>
<rect x="1.5" y="1.5" width="1197" height="427" fill="none" stroke="#12803a" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
